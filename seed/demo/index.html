<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ajax 示例 - Servit</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Ajax 示例</h1>
    <p>当前页面走的是 <code>http://</code> 协议，所以 Ajax 请求能正常发出。点击下面的按钮，向同目录的 <code>data.json</code> 发请求。</p>

    <div class="btn-row">
      <button id="btn-fetch">用 fetch 请求</button>
      <button id="btn-xhr">用 XMLHttpRequest 请求</button>
    </div>

    <h3>返回结果</h3>
    <pre id="output">（还没发请求）</pre>
  </main>

  <script>
    const output = document.getElementById('output');

    document.getElementById('btn-fetch').addEventListener('click', async () => {
      output.textContent = '请求中...';
      try {
        const res = await fetch('data.json');
        const data = await res.json();
        output.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        output.textContent = '出错了: ' + err.message;
      }
    });

    document.getElementById('btn-xhr').addEventListener('click', () => {
      output.textContent = '请求中...';
      const xhr = new XMLHttpRequest();
      xhr.open('GET', 'data.json');
      xhr.onload = () => {
        if (xhr.status === 200) {
          output.textContent = JSON.stringify(JSON.parse(xhr.responseText), null, 2);
        } else {
          output.textContent = '出错了: HTTP ' + xhr.status;
        }
      };
      xhr.onerror = () => { output.textContent = '出错了: 请求失败'; };
      xhr.send();
    });
  </script>
</body>
</html>
